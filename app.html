<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учёт дисков · Этикетки и расход</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#eef1f6;color:#1f2937;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.04);z-index:5}
  header h1{font-size:18px;font-weight:700;color:#111827;white-space:nowrap}
  header .sub{font-size:12px;color:#6b7280}
  .tabs{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
  .tab{padding:9px 18px;border:1px solid transparent;border-radius:9px 9px 0 0;cursor:pointer;font-size:13px;font-weight:600;color:#6b7280;background:transparent;transition:.15s}
  .tab:hover{color:#2563eb;background:#f3f6fc}
  .tab.active{color:#2563eb;background:#eef4ff;border-color:#dbe7ff;border-bottom-color:#eef4ff}
  .panels{flex:1;position:relative;overflow:hidden}
  .panel-wrap{position:absolute;inset:0;display:none}
  .panel-wrap.active{display:block}
  iframe{width:100%;height:100%;border:none}
  footer{background:#fff;border-top:1px solid #e5e7eb;padding:6px 18px;font-size:11px;color:#9ca3af;text-align:center}
</style>
</head>
<body>
<header>
  <div>
    <h1>Учёт дисков</h1>
    <div class="sub">Зуботехническая лаборатория</div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-panel="expend" onclick="switchTab('expend')">Расход дисков</button>
    <button class="tab" data-panel="labels" onclick="switchTab('labels')">Этикетки</button>
  </div>
</header>

<div class="panels">
  <div class="panel-wrap active" id="panel-expend">
    <iframe id="frame-expend" src="otchet.html?v=20261127c"></iframe>
  </div>
  <div class="panel-wrap" id="panel-labels">
    <iframe id="frame-labels" src="etiketi.html?v=20261127c"></iframe>
  </div>
</div>

<footer>Расход — данные из Google-таблицы. Этикетки — генерация кодов и QR, история в браузере.</footer>

<script>
function switchTab(name){
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){ tabs[i].classList.toggle('active', tabs[i].getAttribute('data-panel')===name); }
  var wraps=document.querySelectorAll('.panel-wrap');
  for(var j=0;j<wraps.length;j++){ wraps[j].classList.toggle('active', wraps[j].id==='panel-'+name); }
}
</script>
</body>
</html>
